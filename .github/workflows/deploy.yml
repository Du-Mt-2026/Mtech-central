name: Deploy to KVM8

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.KVM8_HOST }}
          username: ${{ secrets.KVM8_USER }}
          key: ${{ secrets.KVM8_SSH_KEY }}
          port: ${{ secrets.KVM8_PORT || 22 }}
          debug: true
          script_stop: true
          command_timeout: 5m
          script: |
            echo "=== OctupusZap Auto Deploy ==="
            echo "Timestamp: $(date)"
            echo "Host: $(hostname)"

            cd /opt/octupuszap

            echo "📥 Pulling latest changes..."
            git pull origin main

            echo "🐳 Building Docker image..."
            docker compose build app

            echo "🚀 Restarting app container..."
            docker compose up -d app

            echo "⏳ Waiting for migrate to complete..."
            for i in $(seq 1 30); do
              MIGRATE_STATUS=$(docker inspect octupuszap-migrate --format='{{.State.Status}}' 2>/dev/null || echo "not found")
              if [ "$MIGRATE_STATUS" = "exited" ]; then
                echo "✅ Migrate completed!"
                break
              fi
              echo "  Migrate status: $MIGRATE_STATUS... waiting"
              sleep 3
            done

            echo "⏳ Waiting for app to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ App is responding!"
                break
              fi
              sleep 2
            done

            echo "📋 Container status:"
            docker compose ps

            echo "✅ Deploy completed successfully!"
