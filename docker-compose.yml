services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: octupuszap-migrate
    environment:
    - "DATABASE_URL=postgresql://octupuszap:${DB_PASSWORD:-octupuszap123}@db:5432/octupuszap?schema=public"
    depends_on:
      db:
        condition: service_healthy
    networks:
    - internal
    command:
    - sh
    - -c
    - npx prisma@6 migrate deploy && echo 'Migrations done!'
    restart: 'no'
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octupuszap-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://octupuszap:${DB_PASSWORD:-octupuszap123}@db:5432/octupuszap?schema=public"
      EVOLUTION_API_URL: "${EVOLUTION_API_URL:-http://evolution-go:8080}"
      NEXT_PUBLIC_APP_URL: "${APP_PUBLIC_URL:-https://octupuszap.seudominio.com}"
      NODE_ENV: production
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY}"
      # URL interna do microsserviço scraper (rede Docker)
      # Substitui a Google Places API — scraping direto do Google Maps
      SCRAPER_URL: "http://scraper:5000"
    volumes:
      - ./bigquery-service-account.json:/app/bigquery-service-account.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      scraper:
        condition: service_healthy
    networks:
    - internal
    - traefik
    labels:
    - traefik.enable=true
    - "traefik.http.routers.octupuszap.rule=Host(`${APP_DOMAIN:-octupuszap.localhost}`)"
    - traefik.http.routers.octupuszap.entrypoints=websecure
    - traefik.http.routers.octupuszap.tls=true
    - traefik.http.routers.octupuszap.tls.certresolver=letsencrypt
    - traefik.http.services.octupuszap.loadbalancer.server.port=3000
    - "traefik.http.routers.octupuszap-http.rule=Host(`${APP_DOMAIN:-octupuszap.localhost}`)"
    - traefik.http.routers.octupuszap-http.entrypoints=web
    - traefik.http.routers.octupuszap-http.middlewares=redirect-to-https
    deploy:
      resources:
        limits:
          memory: 768M

  # ==========================================
  # Scraper - Microsserviço Python (Playwright)
  # ==========================================
  # Substitui a Google Places API. Faz scraping direto do Google Maps.
  # O Next.js (app) fala com este serviço via rede interna do Docker:
  #   POST http://scraper:5000/scrape  { query, city, uf, ... }
  # Não exponha a porta 5000 publicamente.
  scraper:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: octupuszap-scraper
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ==========================================
  # Database - PostgreSQL (isolado do restante)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: octupuszap-db
    restart: unless-stopped
    environment:
    - POSTGRES_USER=octupuszap
    - "POSTGRES_PASSWORD=${DB_PASSWORD:-octupuszap123}"
    - POSTGRES_DB=octupuszap
    volumes:
    - octupuszap-db-data:/var/lib/postgresql/data
    networks:
    - internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U octupuszap
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
  campaign-cron:
    image: curlimages/curl:latest
    container_name: octupuszap-campaigns
    restart: unless-stopped
    environment:
    - "CRON_SECRET=${CRON_SECRET:-}"
    depends_on:
    - app
    networks:
    - internal
    entrypoint:
    - sh
    - -c
    command:
    - "echo \"\U0001F4CB Campaign cron started (every 60 seconds)...\"\n# Wait for app to be ready\nsleep 15\nwhile true; do\n  if [ -n \"$$CRON_SECRET\" ]; then\n    curl -sf -X POST http://app:3000/api/campaigns/process-all \\\n      -H \"x-cron-secret: $$CRON_SECRET\" \\\n      || echo \"[$(date)] Campaign cron request failed\"\n  else\n    curl -sf -X POST http://app:3000/api/campaigns/process-all \\\n      || echo \"[$(date)] Campaign cron request failed\"\n  fi\n  sleep 60\ndone\n"
    deploy:
      resources:
        limits:
          memory: 32M
  health-cron:
    image: curlimages/curl:latest
    container_name: octupuszap-health
    restart: unless-stopped
    environment:
    - "CRON_SECRET=${CRON_SECRET:-}"
    depends_on:
    - app
    networks:
    - internal
    entrypoint:
    - sh
    - -c
    command:
    - "echo \"⏰ Health check cron started (every 5 minutes)...\"\n# Wait for app to be ready\nsleep 30\nwhile true; do\n  if [ -n \"$$CRON_SECRET\" ]; then\n    curl -sf -X POST http://app:3000/api/cron/health-check \\\n      -H \"Authorization: Bearer $$CRON_SECRET\" \\\n      || echo \"[$(date)] Health check request failed\"\n  else\n    curl -sf -X POST http://app:3000/api/cron/health-check \\\n      || echo \"[$(date)] Health check request failed\"\n  fi\n  sleep 300\ndone\n"
    deploy:
      resources:
        limits:
          memory: 32M
networks:
  internal:
    driver: bridge
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-duda-bot_duda-network}"
volumes:
  octupuszap-db-data:
    driver: local
